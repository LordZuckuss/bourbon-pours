<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Should I Sip Next?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-amber-50 text-stone-900 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-amber-900 text-amber-100 py-6 px-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">🥃 What Should I Sip Next?</h1>
        <p class="text-amber-200 text-sm mt-1">Community Bourbon Recommendations & Ratings</p>
      </div>
      <button onclick="toggleAdmin()" id="adminBtn" class="bg-amber-800 hover:bg-amber-700 text-amber-200 text-xs px-3 py-1.5 rounded transition border border-amber-700">
        🔑 Admin
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto w-full p-4 flex-grow space-y-6">

    <!-- Recommendation Submission Form -->
    <section class="bg-white rounded-xl shadow-sm border border-amber-200 p-6">
      <h2 class="text-xl font-bold text-amber-900 mb-4 flex items-center gap-2">
        <span>📝</span> Submit a Pour Recommendation
      </h2>
      <form id="pourForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wider mb-1">Bourbon Name *</label>
            <input type="text" id="bourbonName" required placeholder="e.g. Eagle Rare 10, Blanton's" class="w-full p-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wider mb-1">Your Name / Handle</label>
            <input type="text" id="recommenderName" placeholder="e.g. Daniel S. (optional)" class="w-full p-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wider mb-1">Distillery or KY Spot</label>
          <input type="text" id="favoriteKYSpot" placeholder="e.g. Buffalo Trace Distillery, Justin's House of Bourbon (optional)" class="w-full p-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wider mb-1">Tasting Notes / Recommendation</label>
          <textarea id="tastingNotes" rows="2" placeholder="Vanilla, oak, smooth finish..." class="w-full p-2.5 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2">
          <div>
            <label class="block text-xs font-semibold text-stone-600 uppercase tracking-wider mb-1">Your Rating</label>
            <div id="formRatingStars" class="flex items-center gap-1 text-2xl text-amber-400 cursor-pointer select-none">
              <!-- Stars dynamically generated -->
            </div>
          </div>
          <button type="submit" class="bg-amber-800 hover:bg-amber-900 text-white font-medium px-6 py-2.5 rounded-lg shadow transition text-center">
            Share Recommendation
          </button>
        </div>
      </form>
    </section>

    <!-- Controls & Filters -->
    <section class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-amber-100/50 p-4 rounded-xl border border-amber-200/60">
      <div class="flex items-center gap-2">
        <label for="sortFilter" class="text-xs font-semibold text-stone-600 uppercase tracking-wider">Sort By:</label>
        <select id="sortFilter" onchange="renderRecommendations()" class="bg-white border border-stone-300 text-stone-800 text-sm rounded-lg p-2 focus:ring-2 focus:ring-amber-500 focus:outline-none">
          <option value="highest">Highest Rated</option>
          <option value="lowest">Lowest Rated</option>
          <option value="recent">Most Recent</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>

      <a href="https://venmo.com/Lord-Zuckuss" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs bg-amber-800 text-amber-100 hover:bg-amber-900 px-3 py-1.5 rounded-full transition font-medium">
        <span>☕</span> Buy the Developer a Pour (Venmo: @Lord-Zuckuss)
      </a>
    </section>

    <!-- Recommendations List -->
    <section id="recommendationsList" class="space-y-4">
      <div class="text-center py-12 text-stone-500">Loading pour recommendations...</div>
    </section>

  </main>

  <footer class="bg-stone-900 text-stone-400 text-xs py-6 text-center mt-auto">
    <p>What Should I Sip Next? &bull; Community Bourbon Tracker</p>
  </footer>

  <!-- App JavaScript Logic -->
  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAWVZRlQWjRBEH3AuKPdwG2VzdZf1DsDqc",
      authDomain: "bourbon-pours.firebaseapp.com",
      projectId: "bourbon-pours",
      storageBucket: "bourbon-pours.appspot.com",
      messagingSenderId: "1080238088421",
      appId: "1:1080238088421:web:d2b3df5e084ef7f0156d40"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let recommendationsData = [];
    let currentFormRating = 5;
    let isAdmin = false;

    // Set up local storage voting memory
    function getVotedPours() {
      return JSON.parse(localStorage.getItem('voted_pours') || '[]');
    }

    function recordVotedPour(id) {
      const voted = getVotedPours();
      if (!voted.includes(id)) {
        voted.push(id);
        localStorage.setItem('voted_pours', JSON.stringify(voted));
      }
    }

    // Initialize Star Selector for Form
    function setFormRating(rating) {
      currentFormRating = rating;
      const container = document.getElementById('formRatingStars');
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('span');
        star.textContent = i <= rating ? '★' : '☆';
        star.onclick = () => setFormRating(i);
        container.appendChild(star);
      }
    }
    setFormRating(5);

    // Fetch realtime data from Firestore
    db.collection("recommendations").onSnapshot((snapshot) => {
      recommendationsData = [];
      snapshot.forEach((doc) => {
        recommendationsData.push({ id: doc.id, ...doc.data() });
      });
      renderRecommendations();
    }, (error) => {
      console.error("Firestore error: ", error);
    });

    // Send Pushover Notification for NEW recommendations only
    function sendPushoverNotification(bourbon, recommender, notes, kySpot) {
      const userKey = "u8dbpz9yj91tyj8t6t4uc883t63kj7";
      const apiToken = "ai8nhogx7ptygjdr6ibx17eq7ymhni";

      const message = `Bourbon: ${bourbon}\nFrom: ${recommender || 'Anonymous'}\nKY Spot: ${kySpot || 'N/A'}\nNotes: ${notes || 'None'}`;

      const formData = new FormData();
      formData.append("token", apiToken);
      formData.append("user", userKey);
      formData.append("title", "🥃 New Bourbon Recommendation!");
      formData.append("message", message);
      formData.append("sound", "glass");

      fetch("https://api.pushover.net/1/messages.json", {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => console.log("Pushover notification sent:", data))
      .catch(err => console.error("Error sending Pushover notification:", err));
    }

    // Handle Form Submit (Creates new pour recommendation)
    function handleFormSubmit(e) {
      e.preventDefault();

      const bourbon = document.getElementById('bourbonName').value.trim();
      const recommender = document.getElementById('recommenderName').value.trim();
      const kySpot = document.getElementById('favoriteKYSpot').value.trim();
      const notes = document.getElementById('tastingNotes').value.trim();

      if (!bourbon) return;

      db.collection("recommendations").add({
        bourbon: bourbon,
        recommender: recommender || 'Anonymous Bourbon Lover',
        kySpot: kySpot || '',
        notes: notes,
        ratings: [currentFormRating],
        createdAt: Date.now()
      }).then((docRef) => {
        recordVotedPour(docRef.id);

        // TRIGGER PUSHOVER NOTIFICATION FOR NEW POUR
        sendPushoverNotification(bourbon, recommender, notes, kySpot);

        document.getElementById('pourForm').reset();
        setFormRating(5);
      }).catch(err => {
        console.error("Error writing to DB: ", err);
        alert("Error saving recommendation. Please try again.");
      });
    }

    // Rate a Pour (Updates existing document ratings array - won't trigger notification)
    function ratePour(id, score) {
      const voted = getVotedPours();
      if (voted.includes(id)) {
        alert("You have already rated this pour!");
        return;
      }

      const docRef = db.collection("recommendations").doc(id);
      db.runTransaction((transaction) => {
        return transaction.get(docRef).then((doc) => {
          if (!doc.exists) return;
          const newRatings = doc.data().ratings || [];
          newRatings.push(score);
          transaction.update(docRef, { ratings: newRatings });
        });
      }).then(() => {
        recordVotedPour(id);
        renderRecommendations();
      }).catch((err) => {
        console.error("Transaction failed: ", err);
      });
    }

    // Toggle Admin Mode
    function toggleAdmin() {
      if (!isAdmin) {
        const pin = prompt("Enter Admin PIN:");
        if (pin === "1986") {
          isAdmin = true;
          document.getElementById('adminBtn').classList.add('bg-red-700', 'text-white');
          document.getElementById('adminBtn').textContent = '🔓 Admin Active';
          renderRecommendations();
        } else if (pin) {
          alert("Incorrect PIN");
        }
      } else {
        isAdmin = false;
        document.getElementById('adminBtn').classList.remove('bg-red-700', 'text-white');
        document.getElementById('adminBtn').textContent = '🔑 Admin';
        renderRecommendations();
      }
    }

    // Delete Recommendation (Admin Only)
    function deleteRecommendation(id) {
      if (!isAdmin) return;
      if (confirm("Are you sure you want to remove this recommendation?")) {
        db.collection("recommendations").doc(id).delete()
          .catch(err => console.error("Error deleting post:", err));
      }
    }

    // Render Cards to UI
    function renderRecommendations() {
      const container = document.getElementById('recommendationsList');
      const sortType = document.getElementById('sortFilter').value;
      const voted = getVotedPours();

      let sorted = [...recommendationsData];

      sorted.forEach(item => {
        const ratings = item.ratings || [5];
        const avg = ratings.reduce((a, b) => a + b, 0) / ratings.length;
        item.avgRating = avg;
        item.voteCount = ratings.length;
      });

      if (sortType === 'highest') sorted.sort((a, b) => b.avgRating - a.avgRating);
      if (sortType === 'lowest') sorted.sort((a, b) => a.avgRating - b.avgRating);
      if (sortType === 'recent') sorted.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (sortType === 'oldest') sorted.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      if (sorted.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-stone-500">No recommendations submitted yet. Be the first to share one above!</div>`;
        return;
      }

      container.innerHTML = sorted.map(item => {
        const hasVoted = voted.includes(item.id);
        const starsHtml = [1, 2, 3, 4, 5].map(star => {
          const isFilled = star <= Math.round(item.avgRating);
          return `<button onclick="ratePour('${item.id}', ${star})" ${hasVoted ? 'disabled' : ''} class="${hasVoted ? 'cursor-default opacity-80' : 'hover:scale-125 transition'} text-amber-400">
            ${isFilled ? '★' : '☆'}
          </button>`;
        }).join('');

        return `
          <div class="bg-white rounded-xl shadow-sm border border-stone-200 p-5 transition hover:shadow-md relative">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-2">
              <div>
                <h3 class="text-xl font-bold text-stone-900">${escapeHtml(item.bourbon)}</h3>
                <p class="text-xs text-stone-500">
                  Recommended by <span class="font-semibold text-amber-900">${escapeHtml(item.recommender || 'Anonymous')}</span>
                  ${item.kySpot ? `&bull; Spot: <span class="italic">${escapeHtml(item.kySpot)}</span>` : ''}
                </p>
              </div>
              <div class="flex items-center gap-2 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200/50 self-start sm:self-auto">
                <div class="flex text-lg">${starsHtml}</div>
                <span class="text-xs font-bold text-amber-900">${item.avgRating.toFixed(1)} <span class="text-stone-400 font-normal">(${item.voteCount})</span></span>
              </div>
            </div>

            ${item.notes ? `<p class="text-sm text-stone-700 bg-stone-50 p-3 rounded-lg mt-3 border border-stone-100">${escapeHtml(item.notes)}</p>` : ''}

            ${isAdmin ? `
              <div class="mt-3 pt-2 border-t border-red-100 flex justify-end">
                <button onclick="deleteRecommendation('${item.id}')" class="text-xs bg-red-100 text-red-700 hover:bg-red-200 px-2.5 py-1 rounded transition font-medium">
                  🗑️ Remove Pour
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Helper to sanitize text HTML output
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
